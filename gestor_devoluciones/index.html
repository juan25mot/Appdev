<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <title>Gestor de Conceptos de Devolución</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><div class="logo">
  <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Documento / factura -->
    <rect x="8" y="4" width="28" height="36" rx="4" stroke="currentColor" stroke-width="2.5" fill="none"/>
    <!-- Líneas de texto (conceptos) -->
    <line x1="14" y1="14" x2="30" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="22" x2="26" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="30" x2="22" y2="30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- Flecha de devolución -->
    <path d="M34 38L30 42M30 42L34 46M30 42H40C42.2091 42 44 40.2091 44 38V30" 
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  <div class="logo-text">
    <span class="logo-title">Devoluciones</span>
    <span class="logo-sub">Gestor de Conceptos</span>
  </div>
</div>
</h1>
    </div>

    <div class="stats">
      <div class="stat">Total: <strong id="stat-total">0</strong></div>
      <div class="stat">Mostrando: <strong id="stat-showing">0</strong></div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar por motivo o concepto..." autocomplete="off">
      </div>
      <button class="btn btn-primary" id="btnNuevo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Nuevo concepto
      </button>
      <button class="btn btn-ghost" id="btnRecargar">↻ Recargar</button>
    </div>

    <div id="list"></div>
  </div>

  <!-- Modal Nuevo/Editar -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Nuevo Concepto</h2>
        <button class="btn btn-ghost" id="btnCerrarModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="inputMotivo">Motivo de devolución <span class="required">*</span></label>
          <input type="text" id="inputMotivo" placeholder="Ej: FALTA PÁGINA 2 DEL AUT">
          <small class="hint">Título corto que identifica el motivo</small>
        </div>
        <div class="form-group">
          <label for="inputConcepto">Concepto / texto completo <span class="required">*</span></label>
          <textarea id="inputConcepto" placeholder="Escribe aquí el concepto completo de devolución..."></textarea>
          <small class="hint">Texto completo que se usará en la devolución</small>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btnCancelar">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardar">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación eliminar -->
  <div class="modal-overlay" id="modalConfirm">
    <div class="modal confirm-modal">
      <div class="modal-header">
        <h2>¿Eliminar concepto?</h2>
      </div>
      <div class="modal-body">
        <p id="confirmText">Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btnCancelarEliminar">Cancelar</button>
        <button class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

    <!-- Firma / Marca de agua -->
  <div class="signature">
    <span class="signature-name">Juan Morantes</span>
    <span class="signature-role">Developer</span>
  </div>

  <script src="turso.js"></script>
  <script src="app.js"></script>
</body>

  <!-- IMPORTANTE: turso.js PRIMERO, app.js DESPUÉS -->
  <script src="turso.js"></script>
  <script src="app.js"></script>
</body>
</html>
